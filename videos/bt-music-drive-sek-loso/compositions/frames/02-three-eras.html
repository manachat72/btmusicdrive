  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="02-three-eras"]');
      const world = root.querySelector('[id="f02-three-eras-world"]');
      const cam = { scale: 1, x: 0, y: 0 };

      function applyCamera() {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      }

      applyCamera();

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-three-eras"] = tl;

      tl.fromTo(
        root.querySelector('[id="f02-three-eras-spot"]'),
        { opacity: 0, scale: 0.88 },
        { opacity: 0.28, scale: 1, duration: 0.58, ease: "power2.out" },
        0.02
      );

      tl.fromTo(
        root.querySelector('[id="f02-three-eras-label-early"]'),
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
        0.04
      );

      tl.fromTo(
        root.querySelector('[id="f02-three-eras-timeline"]'),
        { scaleX: 0 },
        { scaleX: 0.34, duration: 0.56, ease: "power2.out" },
        0.08
      );

      tl.to(
        cam,
        {
          x: -1080,
          duration: 0.67,
          ease: "power3.inOut",
          onUpdate: applyCamera
        },
        0.73
      );

      tl.to(
        root.querySelector('[id="f02-three-eras-timeline"]'),
        { scaleX: 0.67, duration: 0.67, ease: "power3.inOut" },
        0.73
      );

      tl.fromTo(
        root.querySelector('[id="f02-three-eras-label-classic"]'),
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.33, ease: "power3.out" },
        1.04
      );

      tl.fromTo(
        root.querySelector('[id="f02-three-eras-sweep"]'),
        { x: -420, opacity: 0 },
        { x: 1150, opacity: 0.25, duration: 0.47, ease: "none" },
        1.03
      );

      tl.to(
        root.querySelector('[id="f02-three-eras-sweep"]'),
        { opacity: 0, duration: 0.06, ease: "power1.in" },
        1.50
      );

      tl.to(
        cam,
        {
          x: -2160,
          duration: 0.53,
          ease: "power3.inOut",
          onUpdate: applyCamera
        },
        1.56
      );

      tl.to(
        root.querySelector('[id="f02-three-eras-timeline"]'),
        { scaleX: 1, duration: 0.53, ease: "power3.inOut" },
        1.56
      );

      const sequenceStart = 1.61;
      const sequenceEnd = 2.08;
      const sequence = [
        {
          element: root.querySelector('[id="f02-three-eras-label-present"]'),
          text: "ปัจจุบัน",
          hold: 0.08
        },
        {
          element: root.querySelector('[id="f02-three-eras-final-line"]'),
          text: "เส้นทางดนตรี จากอัลบั้มแรกสู่ปัจจุบัน",
          hold: 0.14
        }
      ];
      const secPerCharacter = 0.005;
      const baseDuration = 0.08;
      const weights = sequence.map((entry) => baseDuration + entry.text.length * secPerCharacter + entry.hold);
      const totalWeight = weights.reduce((sum, value) => sum + value, 0);
      let cursor = sequenceStart;

      sequence.forEach((entry, index) => {
        const slot = (sequenceEnd - sequenceStart) * (weights[index] / totalWeight);
        tl.fromTo(
          entry.element,
          { opacity: 0, y: 24, clipPath: "inset(0 0 100% 0)" },
          {
            opacity: 1,
            y: 0,
            clipPath: "inset(0 0 0% 0)",
            duration: Math.max(0.16, slot * 0.86),
            ease: "power3.out"
          },
          cursor
        );
        cursor += slot;
      });
    })();
  </script>
