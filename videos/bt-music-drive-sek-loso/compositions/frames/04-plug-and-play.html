  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    (() => {
      const frameId = "04-plug-and-play";
      const duration = 2.038;
      const root = document.querySelector('[data-composition-id="' + frameId + '"]');
      const hero = document.getElementById("f04-plug-and-play-usb");
      const pedestal = document.getElementById("f04-plug-and-play-pedestal");
      const glow = document.getElementById("f04-plug-and-play-glow");
      const headline = document.getElementById("f04-plug-and-play-headline");
      const headlineLive = document.getElementById("f04-plug-and-play-headline-live");
      const headlineAccent = document.getElementById("f04-plug-and-play-headline-accent");
      const tiles = Array.from(root.querySelectorAll('[data-f04="device-tile"]'));
      const labels = Array.from(root.querySelectorAll('[data-f04="device-label"]'));
      const iconPaths = Array.from(root.querySelectorAll('[data-f04-path="icon"]'));
      const connectorPaths = Array.from(root.querySelectorAll('[data-f04-path="connector"]'));

      [...iconPaths, ...connectorPaths].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      gsap.set(labels, { opacity: 0, y: 12 });
      gsap.set(headlineAccent, { opacity: 0, y: 18 });

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        hero,
        {
          xPercent: 0,
          yPercent: 0,
          x: -58,
          y: -12,
          z: 170,
          rotationX: 16,
          rotationY: -58,
          rotationZ: -7,
          scale: 0.86,
          opacity: 0.2
        },
        {
          x: 0,
          y: 0,
          z: 0,
          rotationX: 0,
          rotationY: 0,
          rotationZ: 0,
          scale: 1,
          opacity: 1,
          duration: 0.58,
          ease: "power3.out"
        },
        0
      );

      tl.fromTo(
        pedestal,
        { scaleX: 0.28, opacity: 0.25, transformOrigin: "50% 50%" },
        { scaleX: 1, opacity: 1, duration: 0.48, ease: "power2.out" },
        0.08
      );

      tl.fromTo(
        glow,
        { opacity: 0, scale: 0.82 },
        { opacity: 0.28, scale: 1.04, duration: 0.56, ease: "power2.out" },
        0.02
      );
      tl.to(
        glow,
        { opacity: 0.18, scale: 1, duration: duration - 0.58, ease: "power1.out" },
        0.58
      );

      tiles.forEach((tile, index) => {
        const targetX = Number(tile.dataset.targetX);
        const targetY = Number(tile.dataset.targetY);
        tl.fromTo(
          tile,
          {
            xPercent: -50,
            yPercent: -50,
            x: 0,
            y: 0,
            scale: 0.58,
            opacity: 0
          },
          {
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
            duration: 0.46,
            ease: "power3.out"
          },
          0.61 + index * 0.055
        );
      });

      const headlineContent = [
        { key: "plug", text: "เสียบ" },
        { key: "listen", text: "เสียบแล้วฟัง" },
        { key: "ready", text: "เสียบแล้วฟังได้" }
      ];
      const baseDuration = 0.085;
      const secondsPerCharacter = 0.008;
      let cumulative = 0;
      const headlineTimeline = headlineContent.map((entry) => {
        const start = cumulative;
        cumulative += baseDuration + entry.text.length * secondsPerCharacter;
        return { key: entry.key, text: entry.text, start, end: cumulative };
      });
      const headlineDriver = { t: 0 };
      let lastHeadlineKey = "";

      tl.fromTo(
        headline,
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" },
        0.66
      );
      tl.to(
        headlineDriver,
        {
          t: cumulative,
          duration: cumulative,
          ease: "none",
          onUpdate: () => {
            let active = headlineTimeline[0];
            for (let index = headlineTimeline.length - 1; index >= 0; index -= 1) {
              if (headlineDriver.t >= headlineTimeline[index].start) {
                active = headlineTimeline[index];
                break;
              }
            }
            if (active.key !== lastHeadlineKey) {
              headlineLive.textContent = active.text;
              lastHeadlineKey = active.key;
            }
          }
        },
        0.66
      );
      tl.fromTo(
        headlineAccent,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.24, ease: "power2.out" },
        1.08
      );

      iconPaths.forEach((path, index) => {
        tl.to(
          path,
          {
            strokeDashoffset: 0,
            duration: 0.34,
            ease: "power2.out"
          },
          0.78 + index * 0.035
        );
      });

      labels.forEach((label, index) => {
        tl.fromTo(
          label,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
          1.46 + index * 0.07
        );
      });

      connectorPaths.forEach((path, index) => {
        tl.to(
          path,
          {
            strokeDashoffset: 0,
            duration: index === 0 ? 0.4 : 0.24,
            ease: "power2.out"
          },
          1.47 + index * 0.29
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;
    })();
  </script>
