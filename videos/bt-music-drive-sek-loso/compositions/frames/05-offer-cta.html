  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      const cover = document.getElementById("f05-cover");
      const sweep = document.getElementById("f05-sweep");
      const offerCard = document.getElementById("f05-offer-card");
      const brandCard = document.getElementById("f05-brand-card");
      const strikePath = document.getElementById("f05-strike-path");
      const logo = document.getElementById("f05-logo");
      const brandName = document.getElementById("f05-brand-name");
      const ctaText = document.getElementById("f05-cta-text");

      const strikeLength = strikePath.getTotalLength();
      strikePath.style.strokeDasharray = String(strikeLength);
      strikePath.style.strokeDashoffset = String(strikeLength);

      tl.fromTo(
        cover,
        { opacity: 0.65, scale: 1.025 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power2.out" },
        0
      );

      tl.fromTo(
        sweep,
        { x: -230, opacity: 0 },
        { x: 1190, opacity: 0.32, duration: 0.58, ease: "none" },
        0.02
      );
      tl.to(sweep, { opacity: 0, duration: 0.10, ease: "power1.in" }, 0.58);

      tl.set(brandCard, { opacity: 0 }, 0);
      tl.fromTo(
        offerCard,
        { opacity: 0, scale: 0.78, y: 42 },
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.62,
          ease: "back.out(1.4)"
        },
        0.70
      );

      tl.to(
        strikePath,
        {
          strokeDashoffset: 0,
          duration: 0.52,
          ease: "power2.out"
        },
        1.72
      );

      tl.set(offerCard, { opacity: 0 }, 2.56);
      tl.set(brandCard, { opacity: 1 }, 2.56);

      tl.fromTo(
        logo,
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.4)" },
        2.58
      );
      tl.fromTo(
        brandName,
        { opacity: 0, x: 26 },
        { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" },
        2.66
      );

      const ctaSequence = [
        { t: 0.00, text: "" },
        { t: 0.08, text: "สั่ง" },
        { t: 0.19, text: "สั่งเลย" },
        { t: 0.31, text: "สั่งเลยที่" },
        { t: 0.48, text: "สั่งเลยที่ BT" },
        { t: 0.65, text: "สั่งเลยที่ BT Music" },
        { t: 0.82, text: "สั่งเลยที่ BT Music Drive" }
      ];

      const textAt = (time) => {
        for (let index = ctaSequence.length - 1; index >= 0; index -= 1) {
          if (time >= ctaSequence[index].t) return ctaSequence[index].text;
        }
        return "";
      };

      const ctaDriver = { t: 0 };
      tl.to(
        ctaDriver,
        {
          t: 0.82,
          duration: 0.82,
          ease: "none",
          onUpdate: () => {
            ctaText.textContent = textAt(ctaDriver.t);
          }
        },
        2.72
      );
      window.__timelines = window.__timelines || {};
      window.__timelines["05-offer-cta"] = tl;
    })();
