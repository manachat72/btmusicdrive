<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" font-family="Kanit, 'Leelawadee UI', Tahoma, sans-serif">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset="0.6" stop-color="#172554"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="gold4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/><stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#b45309"/><stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="brass4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- artwork -->
  <rect width="1000" height="1000" fill="url(#sky4)"/>
  <!-- art-deco sunburst -->
  <g stroke="#fbbf24" stroke-width="3" opacity="0.4">
    <line x1="500" y1="470" x2="500" y2="120"/><line x1="500" y1="470" x2="330" y2="140"/>
    <line x1="500" y1="470" x2="670" y2="140"/><line x1="500" y1="470" x2="200" y2="210"/>
    <line x1="500" y1="470" x2="800" y2="210"/><line x1="500" y1="470" x2="110" y2="320"/>
    <line x1="500" y1="470" x2="890" y2="320"/><line x1="500" y1="470" x2="70" y2="450"/>
    <line x1="500" y1="470" x2="930" y2="450"/>
  </g>
  <g stroke="#fbbf24" fill="none" opacity="0.55">
    <circle cx="500" cy="470" r="210" stroke-width="2"/>
    <circle cx="500" cy="470" r="230" stroke-width="1"/>
  </g>
  <!-- deco side columns -->
  <g fill="#fbbf24" opacity="0.5">
    <rect x="56" y="360" width="10" height="290"/><rect x="76" y="400" width="6" height="250"/>
    <rect x="934" y="360" width="10" height="290"/><rect x="918" y="400" width="6" height="250"/>
  </g>
  <!-- gramophone -->
  <g transform="translate(500 545)">
    <path d="M-6 -160 q120 -40 168 40 q20 36 -8 60 q-60 -80 -152 -66 z" fill="url(#brass4)" stroke="#78350f" stroke-width="3"/>
    <circle cx="-14" cy="-166" r="14" fill="#78350f"/>
    <path d="M-14 -160 q-24 60 -10 120" stroke="#78350f" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="-90" y="-46" width="160" height="66" rx="10" fill="#451a03"/>
    <rect x="-78" y="-34" width="136" height="42" rx="6" fill="#78350f"/>
    <circle cx="-10" cy="52" r="62" fill="#0b0f1a" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="-10" cy="52" r="40" fill="none" stroke="#334155" stroke-width="2"/>
    <circle cx="-10" cy="52" r="24" fill="none" stroke="#334155" stroke-width="2"/>
    <circle cx="-10" cy="52" r="8" fill="#fbbf24"/>
  </g>
  <!-- musical notes -->
  <g fill="#fde68a" opacity="0.9">
    <g transform="translate(240 430)"><ellipse cx="0" cy="0" rx="13" ry="9" transform="rotate(-20)"/><rect x="10" y="-52" width="5" height="52"/></g>
    <g transform="translate(760 410)"><ellipse cx="0" cy="0" rx="13" ry="9" transform="rotate(-20)"/><rect x="10" y="-52" width="5" height="52"/><path d="M15 -52 q26 8 20 34" stroke="#fde68a" stroke-width="5" fill="none"/></g>
  </g>

  <!-- title 3D gold -->
  <g text-anchor="middle" font-weight="800">
    <text x="503" y="228" font-size="100" fill="#020617" opacity="0.95">ลูกกรุงคลาสสิก</text>
    <text x="500" y="223" font-size="100" fill="url(#gold4)" stroke="#78350f" stroke-width="2">ลูกกรุงคลาสสิก</text>
    <text x="500" y="286" font-size="34" fill="#bfdbfe" letter-spacing="5">เพลงหวานวันวาน เสียงครวญคลาสสิก</text>
  </g>

  <!-- ===== mock frame BUTTHRRM (ของจริงใช้ template PNG) ===== -->
  <g>
    <rect x="53" y="14" width="242" height="58" rx="29" fill="#0F172A" opacity="0.85"/>
    <text x="174" y="53" text-anchor="middle" font-size="30" font-weight="700" fill="#fbbf24">USB • MP3</text>
    <circle cx="936" cy="62" r="44" fill="#8B7355" stroke="#fcd34d" stroke-width="4"/>
    <text x="936" y="55" text-anchor="middle" font-size="15" font-weight="800" fill="#fff7ed">PREMIUM</text>
    <text x="936" y="76" text-anchor="middle" font-size="13" fill="#fde68a">QUALITY</text>
    <rect x="6" y="685" width="981" height="244" fill="url(#bar4)" opacity="0.96"/>
    <rect x="6" y="685" width="981" height="6" fill="#fbbf24"/>
    <text x="497" y="790" text-anchor="middle" font-size="86" font-weight="800" fill="#fbbf24" letter-spacing="10">BUTTHRRM</text>
    <text x="497" y="840" text-anchor="middle" font-size="28" fill="#cbd5e1">แฟลชไดรฟ์เพลง MP3 คุณภาพเสียงระดับพรีเมียม</text>
    <rect x="651" y="850" width="315" height="124" rx="18" fill="url(#gold4)"/>
    <text x="808" y="938" text-anchor="middle" font-size="76" font-weight="800" fill="#0F172A">279.-</text>
    <text x="180" y="925" font-size="24" fill="#64748b">*กรอบจริงใช้ template ร้าน</text>
  </g>
</svg>
