<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" font-family="Kanit, 'Leelawadee UI', Tahoma, sans-serif">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1065"/><stop offset="0.55" stop-color="#7e22ce"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="gold5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/><stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/><stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="spot5" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#fef08a" stop-opacity="0.8"/><stop offset="1" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- artwork -->
  <rect width="1000" height="1000" fill="url(#sky5)"/>
  <!-- spotlights -->
  <path d="M180 90 L60 620 L340 620 Z" fill="url(#spot5)"/>
  <path d="M820 90 L660 620 L940 620 Z" fill="url(#spot5)"/>
  <path d="M500 60 L360 640 L640 640 Z" fill="url(#spot5)" opacity="0.7"/>
  <!-- disco ball -->
  <g transform="translate(500 385)">
    <line x1="0" y1="-90" x2="0" y2="-260" stroke="#e2e8f0" stroke-width="4"/>
    <circle r="88" fill="#c7d2fe"/>
    <g stroke="#6366f1" stroke-width="2" fill="none">
      <ellipse rx="88" ry="30"/><ellipse rx="88" ry="60"/>
      <ellipse rx="30" ry="88"/><ellipse rx="60" ry="88"/><circle r="88"/>
    </g>
    <circle cx="-30" cy="-34" r="12" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- pha khao ma stripes -->
  <g opacity="0.9">
    <rect x="0" y="596" width="1000" height="18" fill="#f43f5e"/>
    <rect x="0" y="614" width="1000" height="12" fill="#fbbf24"/>
    <rect x="0" y="626" width="1000" height="16" fill="#22d3ee"/>
    <rect x="0" y="642" width="1000" height="10" fill="#f8fafc"/>
    <rect x="0" y="652" width="1000" height="18" fill="#8b5cf6"/>
  </g>
  <!-- khaen (แคน) silhouettes -->
  <g fill="#1e1b4b">
    <g transform="translate(150 560) rotate(-14)">
      <rect x="-8" y="-150" width="9" height="180" rx="4"/><rect x="4" y="-180" width="9" height="210" rx="4"/>
      <rect x="16" y="-160" width="9" height="190" rx="4"/><rect x="28" y="-130" width="9" height="160" rx="4"/>
      <ellipse cx="14" cy="16" rx="34" ry="16"/>
    </g>
    <g transform="translate(846 560) rotate(14)">
      <rect x="-8" y="-150" width="9" height="180" rx="4"/><rect x="4" y="-180" width="9" height="210" rx="4"/>
      <rect x="16" y="-160" width="9" height="190" rx="4"/><rect x="28" y="-130" width="9" height="160" rx="4"/>
      <ellipse cx="14" cy="16" rx="34" ry="16"/>
    </g>
  </g>
  <!-- dancing crowd silhouette -->
  <g fill="#1e1b4b">
    <path d="M320 662 q6 -30 22 -34 q4 -18 18 -18 q14 0 18 18 q16 4 20 34 z"/>
    <path d="M420 668 q6 -34 24 -38 q4 -20 20 -20 q16 0 20 20 q18 4 22 38 z"/>
    <path d="M530 664 q6 -30 22 -34 q4 -18 18 -18 q14 0 18 18 q16 4 20 34 z"/>
    <path d="M628 668 q6 -26 20 -30 q4 -16 16 -16 q12 0 16 16 q14 4 18 30 z"/>
  </g>

  <!-- title 3D gold -->
  <g text-anchor="middle" font-weight="800">
    <text x="503" y="218" font-size="98" fill="#2e1065" opacity="0.95">หมอลำม่วนซื่น</text>
    <text x="500" y="213" font-size="98" fill="url(#gold5)" stroke="#78350f" stroke-width="2">หมอลำม่วนซื่น</text>
    <text x="500" y="276" font-size="34" fill="#fbcfe8" letter-spacing="4">รวมฮิต 3ช่า สะเทือนลำโพง</text>
  </g>

  <!-- ===== mock frame BUTTHRRM (ของจริงใช้ template PNG) ===== -->
  <g>
    <rect x="53" y="14" width="242" height="58" rx="29" fill="#0F172A" opacity="0.85"/>
    <text x="174" y="53" text-anchor="middle" font-size="30" font-weight="700" fill="#fbbf24">USB • MP3</text>
    <circle cx="936" cy="62" r="44" fill="#8B7355" stroke="#fcd34d" stroke-width="4"/>
    <text x="936" y="55" text-anchor="middle" font-size="15" font-weight="800" fill="#fff7ed">PREMIUM</text>
    <text x="936" y="76" text-anchor="middle" font-size="13" fill="#fde68a">QUALITY</text>
    <rect x="6" y="685" width="981" height="244" fill="url(#bar5)" opacity="0.96"/>
    <rect x="6" y="685" width="981" height="6" fill="#fbbf24"/>
    <text x="497" y="790" text-anchor="middle" font-size="86" font-weight="800" fill="#fbbf24" letter-spacing="10">BUTTHRRM</text>
    <text x="497" y="840" text-anchor="middle" font-size="28" fill="#cbd5e1">แฟลชไดรฟ์เพลง MP3 คุณภาพเสียงระดับพรีเมียม</text>
    <rect x="651" y="850" width="315" height="124" rx="18" fill="url(#gold5)"/>
    <text x="808" y="938" text-anchor="middle" font-size="76" font-weight="800" fill="#0F172A">279.-</text>
    <text x="180" y="925" font-size="24" fill="#64748b">*กรอบจริงใช้ template ร้าน</text>
  </g>
</svg>
