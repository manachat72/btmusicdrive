<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" font-family="Kanit, 'Leelawadee UI', Tahoma, sans-serif">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset="0.55" stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="fire3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316"/><stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/><stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/><stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- artwork -->
  <rect width="1000" height="1000" fill="url(#sky3)"/>
  <!-- stars -->
  <g fill="#e0f2fe">
    <circle cx="120" cy="330" r="3"/><circle cx="240" cy="380" r="2"/><circle cx="330" cy="320" r="2.5"/>
    <circle cx="680" cy="330" r="2.5"/><circle cx="780" cy="390" r="3"/><circle cx="880" cy="330" r="2"/>
    <circle cx="500" cy="345" r="2"/><circle cx="590" cy="410" r="2"/><circle cx="410" cy="400" r="2"/>
  </g>
  <circle cx="810" cy="230" r="55" fill="#fef9c3" opacity="0.9"/>
  <circle cx="790" cy="218" r="52" fill="url(#sky3)"/>
  <!-- mountains -->
  <path d="M0 640 L200 440 L340 590 L500 400 L680 610 L830 470 L1000 620 L1000 760 L0 760 Z" fill="#082f49"/>
  <path d="M0 700 L260 540 L470 690 L700 560 L1000 700 L1000 800 L0 800 Z" fill="#041a2e"/>
  <!-- campfire -->
  <g transform="translate(310 640)">
    <ellipse cx="0" cy="52" rx="120" ry="26" fill="url(#glow3)"/>
    <path d="M0 40 q-34 -26 -18 -66 q10 22 22 26 q-10 -34 16 -58 q-2 30 16 44 q12 -14 8 -36 q24 26 12 62 q-14 34 -56 28 z" fill="url(#fire3)"/>
    <rect x="-44" y="36" width="88" height="12" rx="6" fill="#451a03" transform="rotate(-14)"/>
    <rect x="-44" y="40" width="88" height="12" rx="6" fill="#78350f" transform="rotate(12)"/>
  </g>
  <!-- guitar man silhouette -->
  <g fill="#010b14" transform="translate(640 560)">
    <circle cx="0" cy="0" r="26"/>
    <path d="M-20 18 q-16 40 -8 86 l56 0 q10 -50 -6 -84 q-20 12 -42 -2 z"/>
    <path d="M-64 60 q-26 -6 -34 14 q-6 18 12 26 q20 8 34 -8 l64 -34 l-8 -16 z"/>
    <circle cx="-84" cy="82" r="20" fill="#010b14"/>
    <line x1="-58" y1="66" x2="26" y2="22" stroke="#010b14" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- title 3D gold -->
  <g text-anchor="middle" font-weight="800">
    <text x="503" y="223" font-size="96" fill="#020617" opacity="0.95">เพื่อชีวิต รวมฮิต</text>
    <text x="500" y="218" font-size="96" fill="url(#gold3)" stroke="#78350f" stroke-width="2">เพื่อชีวิต รวมฮิต</text>
    <text x="500" y="282" font-size="34" fill="#bae6fd" letter-spacing="4">บทเพลงแห่งขุนเขา เสียงกีตาร์ข้างกองไฟ</text>
  </g>

  <!-- ===== mock frame BUTTHRRM (ของจริงใช้ template PNG) ===== -->
  <g>
    <rect x="53" y="14" width="242" height="58" rx="29" fill="#0F172A" opacity="0.85"/>
    <text x="174" y="53" text-anchor="middle" font-size="30" font-weight="700" fill="#fbbf24">USB • MP3</text>
    <circle cx="936" cy="62" r="44" fill="#8B7355" stroke="#fcd34d" stroke-width="4"/>
    <text x="936" y="55" text-anchor="middle" font-size="15" font-weight="800" fill="#fff7ed">PREMIUM</text>
    <text x="936" y="76" text-anchor="middle" font-size="13" fill="#fde68a">QUALITY</text>
    <rect x="6" y="685" width="981" height="244" fill="url(#bar3)" opacity="0.96"/>
    <rect x="6" y="685" width="981" height="6" fill="#fbbf24"/>
    <text x="497" y="790" text-anchor="middle" font-size="86" font-weight="800" fill="#fbbf24" letter-spacing="10">BUTTHRRM</text>
    <text x="497" y="840" text-anchor="middle" font-size="28" fill="#cbd5e1">แฟลชไดรฟ์เพลง MP3 คุณภาพเสียงระดับพรีเมียม</text>
    <rect x="651" y="850" width="315" height="124" rx="18" fill="url(#gold3)"/>
    <text x="808" y="938" text-anchor="middle" font-size="76" font-weight="800" fill="#0F172A">279.-</text>
    <text x="180" y="925" font-size="24" fill="#64748b">*กรอบจริงใช้ template ร้าน</text>
  </g>
</svg>
